# nginx add_header is not inherited once a block adds its own, so every location includes this file.
# The CSP matches the <meta> policy in index.html, plus what only a header can do (frame-ancestors).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://ipfs.io https://*.ipfs.io https://cloudflare-ipfs.com https://dweb.link https://*.dweb.link https://arweave.net https://*.arweave.net; font-src 'self'; connect-src 'self' https://ipfs.io https://*.ipfs.io https://cloudflare-ipfs.com https://dweb.link https://*.dweb.link https://arweave.net https://*.arweave.net https://api.koinos.io https://testnet.koinosfoundation.org https://*.koinos.io https://*.koinosfoundation.org http://127.0.0.1:* http://localhost:* ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

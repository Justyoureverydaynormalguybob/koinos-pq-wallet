name: mobile

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04 # ubuntu-latest moves to 26 from 2026-10-19; pin what we tested
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "21" } # Capacitor 8 / AGP 8.13 need JDK 21
      - name: Install (git dependency's prepare needs tsc, so scripts are skipped; its dist is committed)
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Build the web app and copy it into the Android project
        run: |
          npm run build
          npx cap sync android
      - name: Restore the release keystore from secrets
        # The keystore is exposed to this step only: npm, vite and the test runner never see it.
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          ls -la app/build/outputs/apk/release/ app/build/outputs/bundle/release/
      - name: Name and hash the APK
        run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "koinos-pq-wallet-$V.apk"
          sha256sum "koinos-pq-wallet-$V.apk" | tee "koinos-pq-wallet-$V.apk.sha256"
          cp android/app/build/outputs/bundle/release/app-release.aab "koinos-pq-wallet-$V.aab"
          sha256sum "koinos-pq-wallet-$V.aab" | tee "koinos-pq-wallet-$V.aab.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: |
            koinos-pq-wallet-*.apk
            koinos-pq-wallet-*.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-aab
          path: |
            koinos-pq-wallet-*.aab
            koinos-pq-wallet-*.aab.sha256
          if-no-files-found: error

  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Build the browser extension and zip it
        run: |
          npm run build:ext
          V=$(node -p "require('./package.json').version")
          (cd dist-extension && zip -r "$GITHUB_WORKSPACE/koinos-pq-wallet-extension-$V.zip" .)
          sha256sum "koinos-pq-wallet-extension-$V.zip" | tee "koinos-pq-wallet-extension-$V.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-zip
          path: |
            koinos-pq-wallet-extension-*.zip
            koinos-pq-wallet-extension-*.zip.sha256
          if-no-files-found: error

  ios:
    # Capacitor 8 needs Xcode 26; the macOS 26 image has it as the default toolchain
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: xcodebuild -version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Build the web app and copy it into the iOS project
        run: |
          npm run build
          npx cap sync ios
      - name: Build (unsigned) for a device
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          ls build/Build/Products/Release-iphoneos/
          cd build/Build/Products/Release-iphoneos && zip -r "$GITHUB_WORKSPACE/koinos-pq-wallet-ios-unsigned.zip" App.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-app-unsigned
          path: koinos-pq-wallet-ios-unsigned.zip

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Receive</title>
<link rel="stylesheet" href="../src/ui/tokens.css">
<style>
  /* stand-in for the QR canvas the app draws */
  .qr-fake { width: 220px; height: 220px; background:
    repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 16px),
    repeating-linear-gradient(0deg, #000 0 8px, #fff 8px 16px); }
</style>
</head>
<body>
<div class="shell">
  <header class="hdr">
    <span class="mark"><span class="px" aria-hidden="true"></span>PQ <span class="hex" aria-hidden="true">50 51</span></span>
    <button class="btn ghost mini" type="button">Lock</button>
  </header>
  <div class="ticker"><span><span class="live" aria-hidden="true"></span>mainnet</span><span>head 24,118,402</span></div>
  <main class="content">
    <h2 class="sec"><span><span class="n">[01]</span> Receive</span><span>Your account</span></h2>
    <section class="card" style="text-align:center">
      <div class="qr" style="display:inline-block"><div class="qr-fake" role="img" aria-label="QR code of the address"></div></div>
      <span class="addr box" style="text-align:left"><span class="g k">1LQY</span><span class="g">sdpG</span><span class="g">uA3n</span><span class="g">wU5G</span><span class="g">1jAN</span><span class="g">CnMW</span><span class="g">s3yY</span><span class="g">Wf<b class="k">Hw</b></span><span class="g k">kQ</span></span>
      <div class="row"><button class="btn primary" type="button">Copy address</button><button class="btn ghost" type="button">Back</button></div>
      <p class="fine" style="margin-top:12px">The clipboard clears itself 60 s after copying.</p>
    </section>
  </main>
  <nav class="tabs" aria-label="Sections">
    <a href="account.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/><circle cx="16" cy="12" r="1.5"/></svg>Account</a>
    <a href="activity.html"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 14 8 14 10 7 14 17 16 11 21 11"/></svg>Activity</a>
    <a href="dapps.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Dapps</a>
    <a href="settings.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</a>
  </nav>
</div>

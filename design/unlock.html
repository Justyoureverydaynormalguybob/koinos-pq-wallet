<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unlock</title>
<link rel="stylesheet" href="../src/ui/tokens.css">
</head>
<body>
<div class="shell">
  <header class="hdr">
    <span class="mark"><span class="px" aria-hidden="true"></span>PQ <span class="hex" aria-hidden="true">50 51</span></span>
    <span class="hexstrip">ML-DSA-44</span>
  </header>
  <main class="content plain">
    <h1 class="wide" style="margin-top:40px">Unlock</h1>
    <form>
      <label class="field"><span>Passphrase</span><input type="password" autocomplete="current-password" autofocus></label>
      <div class="row"><button class="btn primary block" type="submit">Unlock</button></div>
    </form>
    <p class="fine" style="margin-top:24px">Lost the passphrase? <button class="link" type="button">Delete this wallet</button> and import your 24 words again.</p>
    <p class="foot">Sparán · open source, MIT</p>
  </main>
</div>
</body>
</html>

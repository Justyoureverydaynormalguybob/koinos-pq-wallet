<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send</title>
<link rel="stylesheet" href="../src/ui/tokens.css">
</head>
<body>
<div class="shell">
  <header class="hdr">
    <span class="mark"><span class="px" aria-hidden="true"></span>PQ <span class="hex" aria-hidden="true">50 51</span></span>
    <button class="btn ghost mini" type="button">Lock</button>
  </header>
  <div class="ticker"><span><span class="live" aria-hidden="true"></span>mainnet</span><span>head 24,118,402</span></div>
  <main class="content">
    <h2 class="sec"><span><span class="n">[01]</span> Send</span><span>from 1LQY…HwkQ</span></h2>
    <form>
      <label class="field"><span>Token</span>
        <select><option>KOIN · 1,234.5678</option><option>VHP · 0</option><option>KOINDX · 52.1</option></select></label>
      <label class="field"><span>To</span>
        <div class="withbtn"><input class="mono" placeholder="1…" autocomplete="off"><button class="btn mini" type="button" aria-label="Scan a QR code"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="stroke:currentColor;fill:none;stroke-width:1.75"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><rect x="8" y="8" width="8" height="8"/></svg></button></div></label>
      <label class="field"><span>Amount</span>
        <div class="withbtn"><input class="mono" inputmode="decimal" placeholder="0.5" autocomplete="off"><button class="btn mini" type="button">Max</button></div></label>
      <p class="fine">Signed here with ML-DSA-44 (2,420-byte signature). The recipient is checked before anything is signed: a first-time or look-alike address asks you to confirm it.</p>
      <div class="row"><button class="btn primary" type="submit">Sign and send</button><button class="btn ghost" type="button">Back</button></div>
    </form>
  </main>
  <nav class="tabs" aria-label="Sections">
    <a href="account.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/><circle cx="16" cy="12" r="1.5"/></svg>Account</a>
    <a href="activity.html"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 14 8 14 10 7 14 17 16 11 21 11"/></svg>Activity</a>
    <a href="dapps.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Dapps</a>
    <a href="settings.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</a>
  </nav>
</div>
</body>
</html>

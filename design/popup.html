<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popup</title>
<link rel="stylesheet" href="../src/ui/tokens.css">
</head>
<body class="popup">
<div class="shell">
  <header class="hdr">
    <span class="mark"><span class="px" aria-hidden="true"></span>PQ <span class="hex" aria-hidden="true">50 51</span></span>
    <span><button class="btn ghost mini" type="button">Open in a tab</button><button class="btn ghost mini" type="button">Lock</button></span>
  </header>
  <div class="ticker"><span><span class="live" aria-hidden="true"></span>mainnet</span><span>head 24,118,402</span></div>
  <main class="content">
    <h2 class="sec"><span><span class="n">[01]</span> Account</span><span class="hexstrip" aria-hidden="true">00 D3 1B 7A 42</span></h2>
    <section class="card">
      <span class="lbl">Your account</span>
      <span class="addr sm"><span class="g k">1LQY</span><span class="g">sdpG</span><span class="g">uA3n</span><span class="g">wU5G</span><span class="g">1jAN</span><span class="g">CnMW</span><span class="g">s3yY</span><span class="g">Wf<b class="k">Hw</b></span><span class="g k">kQ</span></span>
      <div class="bal" style="margin-top:14px"><span class="v" style="font-size:28px">1,234.5678</span><span class="u">KOIN</span></div>
      <div class="actions" style="margin-top:12px">
        <button class="btn primary" type="button">Send</button>
        <button class="btn" type="button">Receive</button>
      </div>
    </section>
    <h2 class="sec"><span><span class="n">[02]</span> Tokens</span></h2>
    <ul class="list">
      <li><span class="tile">KOIN</span><span class="grow"><span class="t">Koin</span></span><span class="amt">1,234.5678</span></li>
      <li><span class="tile">KDX</span><span class="grow"><span class="t">Koindx Token</span></span><span class="amt">52.1</span></li>
    </ul>
  </main>
  <nav class="tabs" aria-label="Sections">
    <a href="account.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/><circle cx="16" cy="12" r="1.5"/></svg>Account</a>
    <a href="activity.html"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 14 8 14 10 7 14 17 16 11 21 11"/></svg>Activity</a>
    <a href="settings.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</a>
  </nav>
</div>
</body>
</html>
